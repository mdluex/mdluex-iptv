plugins {
    id 'com.android.application'
}

// The shared TV app (../../app) is the web part of this Android app: copy it into the APK assets at build time.
def wwwOut = layout.buildDirectory.dir('generated/www')
tasks.register('syncWww', Sync) {
    from(rootProject.file('../../app')) {
        exclude 'config.xml', '.buildResult/**', '.sign/**', '*.wgt'
    }
    into wwwOut.map { it.dir('www') }
}

// Version follows the shared app's config.xml
def appVersion = (rootProject.file('../../app/config.xml').text =~ /<widget[^>]*\sversion="([\d.]+)"/)[0][1]
def parts = appVersion.tokenize('.').collect { it as int }

// Release signing key lives outside the repo (keystore.properties is git-ignored)
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) { ks.load(new FileInputStream(ksFile)) }

android {
    namespace 'com.mdluex.iptv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mdluex.iptv'
        minSdk 24
        targetSdk 36
        versionName appVersion
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) { signingConfig signingConfigs.release }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main { assets.srcDirs += wwwOut.get().asFile }
    }
}
tasks.named('preBuild') { dependsOn 'syncWww' }

dependencies {
    def media3 = '1.8.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
}
