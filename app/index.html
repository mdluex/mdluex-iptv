<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Mdluex IPTV</title>
  <link rel="stylesheet" href="css/app.css?v=20261128183307">
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <div id="stage">
    <div id="app-root">
      <aside id="sidebar" data-zone="nav"></aside>
      <header id="topbar">
        <div id="page-title"></div>
        <div id="top-right">
          <div id="account-chip" class="chip"></div>
          <div id="clock"></div>
        </div>
      </header>
      <main id="view"></main>
      <div id="hintbar"></div>
    </div>

    <div id="player-layer" class="hidden">
      <object id="av-player" type="application/avplayer"></object>
      <video id="html5-player" playsinline></video>
      <div id="sim-player"><div class="sim-title"></div><div class="sim-sub">Demo playback</div></div>
      <div id="yt-holder"><div id="yt-frame"></div></div>
      <div id="subtitle-box"></div>
      <div id="player-spinner" class="spinner hidden"></div>
      <div id="osd"></div>
    </div>

    <div id="modal-layer"></div>
    <div id="toast" dir="auto"></div>
  </div>
  <script src="js/legacy.js?v=20261128183307"></script>
  <script src="js/platform.js?v=20261128183307"></script>
  <script src="js/storage.js?v=20261128183307"></script>
  <script src="js/i18n.js?v=20261128183307"></script>
  <script src="js/api.js?v=20261128183307"></script>
  <script src="js/focus.js?v=20261128183307"></script>
  <script src="js/player.js?v=20261128183307"></script>
  <script src="js/channel_snapshot.js?v=20261128183307"></script>
  <script src="js/youtube.js?v=20261128183307"></script>
  <script src="js/qrcode.js?v=20261128183307"></script>
  <script src="js/phonelink.js?v=20261128183307"></script>
  <script src="js/app.js?v=20261128183307"></script>
  <script src="js/views.js?v=20261128183307"></script>
  <script src="js/quran.js?v=20261128183307"></script>
  <script src="js/playerui.js?v=20261128183307"></script>
  <script>App.start();</script>
</body>
</html>
