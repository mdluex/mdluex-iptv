<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- Interlaced strapwork for the ends of the surah header: two straps weave across the tile and leave it exactly
       as they enter it, so repeated tiles form one continuous chain. -->
  <g stroke="none">
    <path d="M0 50 C20 18 60 18 80 50 C60 82 20 82 0 50Z" fill="#f4b9b1"/>
    <path d="M80 50 C100 82 140 82 160 50 C140 18 100 18 80 50Z" fill="#f4b9b1"/>
  </g>
  <g fill="none" stroke-linecap="butt">
    <path d="M0 50 C20 18 60 18 80 50 S140 82 160 50" stroke="#a8251d" stroke-width="9"/>
    <path d="M0 50 C20 82 60 82 80 50 S140 18 160 50" stroke="#a8251d" stroke-width="9"/>
    <path d="M0 50 C20 18 60 18 80 50 S140 82 160 50" stroke="#fffaf0" stroke-width="3.2"/>
    <path d="M0 50 C20 82 60 82 80 50 S140 18 160 50" stroke="#fffaf0" stroke-width="3.2"/>
  </g>
  <!-- a rosette in each eye of the chain, a knot where the straps cross -->
  <g stroke="#a8251d" stroke-width="2.2">
    <circle cx="40" cy="50" r="11" fill="#fffaf0"/>
    <circle cx="120" cy="50" r="11" fill="#fffaf0"/>
    <circle cx="40" cy="50" r="5.5" fill="#d9534a"/>
    <circle cx="120" cy="50" r="5.5" fill="#d9534a"/>
    <path d="M80 41 89 50 80 59 71 50Z" fill="#d9534a"/>
    <path d="M0 41 9 50 0 59 -9 50Z" fill="#d9534a"/>
    <path d="M160 41 169 50 160 59 151 50Z" fill="#d9534a"/>
  </g>
</svg>
