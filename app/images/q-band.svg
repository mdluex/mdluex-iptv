<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" fill="#fffaf0"/>
  <!-- quarter flowers in the corners join up with the neighbouring tiles -->
  <g fill="#f4b9b1" stroke="#b3241c" stroke-width="1.6">
    <path d="M0 0 Q16 3 20 20 Q3 16 0 0Z"/>
    <path d="M80 0 Q64 3 60 20 Q77 16 80 0Z"/>
    <path d="M0 80 Q16 77 20 60 Q3 64 0 80Z"/>
    <path d="M80 80 Q64 77 60 60 Q77 64 80 80Z"/>
  </g>
  <!-- eight-petal rosette -->
  <g fill="#f6c7c0" stroke="#b3241c" stroke-width="1.6">
    <ellipse cx="40" cy="26" rx="6" ry="11"/>
    <ellipse cx="40" cy="26" rx="6" ry="11" transform="rotate(45 40 40)"/>
    <ellipse cx="40" cy="26" rx="6" ry="11" transform="rotate(90 40 40)"/>
    <ellipse cx="40" cy="26" rx="6" ry="11" transform="rotate(135 40 40)"/>
    <ellipse cx="40" cy="26" rx="6" ry="11" transform="rotate(180 40 40)"/>
    <ellipse cx="40" cy="26" rx="6" ry="11" transform="rotate(225 40 40)"/>
    <ellipse cx="40" cy="26" rx="6" ry="11" transform="rotate(270 40 40)"/>
    <ellipse cx="40" cy="26" rx="6" ry="11" transform="rotate(315 40 40)"/>
  </g>
  <circle cx="40" cy="40" r="7.5" fill="#d9534a" stroke="#b3241c" stroke-width="1.6"/>
  <circle cx="40" cy="40" r="2.6" fill="#fffaf0"/>
  <g fill="#b3241c">
    <circle cx="40" cy="4" r="2"/><circle cx="40" cy="76" r="2"/><circle cx="4" cy="40" r="2"/><circle cx="76" cy="40" r="2"/>
  </g>
</svg>
