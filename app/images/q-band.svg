<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <!-- interlaced geometric strapwork: eight-pointed stars joined by straps, as on Madinah mushaf borders -->
  <rect width="72" height="72" fill="#fffaf0"/>
  <!-- straps running to the neighbouring tiles -->
  <g fill="none" stroke="#a8251d" stroke-width="7" stroke-linecap="butt">
    <path d="M0 36h72M36 0v72"/>
  </g>
  <g fill="none" stroke="#f6c7c0" stroke-width="3.4">
    <path d="M0 36h72M36 0v72"/>
  </g>
  <!-- the star -->
  <g fill="#f4b9b1" stroke="#a8251d" stroke-width="2.4" stroke-linejoin="round">
    <rect x="18" y="18" width="36" height="36"/>
    <rect x="18" y="18" width="36" height="36" transform="rotate(45 36 36)"/>
  </g>
  <g fill="none" stroke="#fffaf0" stroke-width="1.4">
    <rect x="22.5" y="22.5" width="27" height="27"/>
    <rect x="22.5" y="22.5" width="27" height="27" transform="rotate(45 36 36)"/>
  </g>
  <circle cx="36" cy="36" r="9" fill="#d9534a" stroke="#a8251d" stroke-width="2"/>
  <circle cx="36" cy="36" r="3.4" fill="#fffaf0"/>
  <!-- small diamonds where four tiles meet -->
  <g fill="#d9534a" stroke="#a8251d" stroke-width="1.6">
    <path d="M0 -7 7 0 0 7 -7 0Z"/>
    <path d="M72 -7 79 0 72 7 65 0Z"/>
    <path d="M0 65 7 72 0 79 -7 72Z"/>
    <path d="M72 65 79 72 72 79 65 72Z"/>
  </g>
</svg>
