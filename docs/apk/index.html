<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mdluex IPTV for Android TV and Fire TV</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0c;
         color: #f2f2f2; font: 22px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { padding: 24px; max-width: 760px; }
  h1 { font-size: 40px; margin: 0 0 12px; }
  a { color: #fff; background: #d11515; display: inline-block; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 700; margin-top: 18px; }
  a:focus { outline: 4px solid #fff; }
  small { display: block; color: #9a9a9a; margin-top: 22px; font-size: 16px; }
</style>
</head>
<body>
<main>
  <h1>Mdluex IPTV</h1>
  <p id="msg">Finding the latest version…</p>
  <a id="dl" href="https://github.com/mdluex/mdluex-iptv/releases/latest">Download for Android TV / Fire TV</a>
  <small>If the download doesn't start, select the button above.</small>
</main>
<script>
  /* Short link for TV "Downloader" apps: sends you to the Android APK of the latest release. */
  var REPO = 'mdluex/mdluex-iptv';
  var a = document.getElementById('dl'), msg = document.getElementById('msg');
  a.focus();
  fetch('https://api.github.com/repos/' + REPO + '/releases/latest')
    .then(function (r) { return r.json(); })
    .then(function (rel) {
      var apk = (rel.assets || []).filter(function (x) { return /-android\.apk$/.test(x.name); })[0];
      if (!apk) throw new Error('no apk');
      a.href = apk.browser_download_url;
      msg.textContent = 'Downloading version ' + String(rel.tag_name || '').replace(/^v/, '') + '…';
      location.href = apk.browser_download_url;
    })
    .catch(function () { msg.textContent = 'Open the latest release and download the file ending in -android.apk.'; });
</script>
</body>
</html>
