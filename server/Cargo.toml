[package]
name = "mdluex-iptv-server"
version = "1.1.1"
edition = "2021"
authors = ["Mahmoud Salah"]
description = "Self-hosted IPTV media server with an Xtream Codes compatible API and a web admin panel"
license-file = "../LICENSE"

[[bin]]
name = "mdluex-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
argon2 = "0.5"
rand = "0.8"
rust-embed = "8"
mime_guess = "2"
regex = "1"
walkdir = "2"
chrono = "0.4"
quick-xml = "0.36"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
parking_lot = "0.12"
base64 = "0.22"
open = "5"
bytes = "1"
urlencoding = "2"
once_cell = "1"
flate2 = "1"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
